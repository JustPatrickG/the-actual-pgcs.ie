<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>snake — pgcs//arcade</title>
  <meta name="robots" content="noindex, nofollow" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="arcade.css" />
</head>
<body class="arcade-body">
  <div class="scanlines"></div>

  <main class="game-shell">
    <div class="game-topbar">
      <a href="secret.html">&larr; arcade</a>
      <span class="game-score">score: <span id="score">0</span></span>
    </div>

    <div class="game-canvas-wrap" id="wrap">
      <canvas id="canvas"></canvas>
      <div class="game-overlay" id="overlay">
        <h2 id="overlayTitle">game over</h2>
        <p id="overlaySub">score: 0</p>
        <button class="restart-btn" id="restartBtn">play again</button>
      </div>
    </div>

    <p class="game-hint">swipe to steer &middot; arrows / wasd on desktop</p>
  </main>

  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const wrap = document.getElementById('wrap');
    const scoreEl = document.getElementById('score');
    const overlay = document.getElementById('overlay');
    const overlayTitle = document.getElementById('overlayTitle');
    const overlaySub = document.getElementById('overlaySub');
    const restartBtn = document.getElementById('restartBtn');

    const GREEN = '#3ddc84';
    const WHITE = '#eafff2';
    const RED = '#ff5f5f';

    const GRID = 17;
    let cell, W;
    let snake, dir, queuedDirs, food, score, state; // state: 'play' | 'dead'
    let moveInterval, moveTimer;       // ms per step, accumulator
    let shakeT, particles, foodPulse, deathT, deathCells;
    let last;

    function resize() {
      const rect = wrap.getBoundingClientRect();
      const dpr = window.devicePixelRatio || 1;
      W = Math.floor(Math.min(rect.width, rect.height));
      canvas.width = W * dpr;
      canvas.height = W * dpr;
      canvas.style.width = W + 'px';
      canvas.style.height = W + 'px';
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      cell = W / GRID;
    }

    function spawnFood() {
      let p;
      do {
        p = { x: (Math.random() * GRID) | 0, y: (Math.random() * GRID) | 0 };
      } while (snake.some((s) => s.x === p.x && s.y === p.y));
      food = p;
      foodPulse = 0;
    }

    function reset() {
      snake = [{ x: 8, y: 8 }, { x: 7, y: 8 }, { x: 6, y: 8 }].map((c) => ({ ...c, px: c.x, py: c.y }));
      dir = { x: 1, y: 0 };
      queuedDirs = [];
      score = 0;
      state = 'play';
      moveInterval = 150;
      moveTimer = 0;
      shakeT = 0;
      deathT = 0;
      deathCells = [];
      particles = [];
      foodPulse = 0;
      spawnFood();
      scoreEl.textContent = '0';
      overlay.classList.remove('show');
      last = performance.now();
    }

    function pushDir(x, y) {
      const ref = queuedDirs.length ? queuedDirs[queuedDirs.length - 1] : dir;
      if (ref.x === x && ref.y === y) return;
      if (ref.x === -x && ref.y === -y) return; // no 180s
      if (queuedDirs.length < 2) queuedDirs.push({ x, y });
    }

    function burst(cx, cy, color, n) {
      for (let i = 0; i < n; i++) {
        const a = Math.random() * Math.PI * 2;
        const sp = 1 + Math.random() * 3;
        particles.push({
          x: cx, y: cy,
          vx: Math.cos(a) * sp, vy: Math.sin(a) * sp,
          life: 1, color, size: 1 + Math.random() * 2.5,
        });
      }
    }

    function stepGame() {
      if (queuedDirs.length) dir = queuedDirs.shift();
      const head = snake[0];
      const nx = head.x + dir.x;
      const ny = head.y + dir.y;

      const hitWall = nx < 0 || nx >= GRID || ny < 0 || ny >= GRID;
      const hitSelf = snake.some((s, i) => i < snake.length - 1 && s.x === nx && s.y === ny);
      if (hitWall || hitSelf) {
        die();
        return;
      }

      const newHead = { x: nx, y: ny, px: head.x, py: head.y };
      snake.unshift(newHead);

      if (nx === food.x && ny === food.y) {
        score++;
        scoreEl.textContent = String(score);
        burst((food.x + 0.5) * cell, (food.y + 0.5) * cell, GREEN, 14);
        shakeT = 0.18;
        moveInterval = Math.max(70, moveInterval - 4);
        spawnFood();
        // grow: keep tail (don't pop), but set its px/py so it eases out from itself
        const tail = snake[snake.length - 1];
        tail.px = tail.x; tail.py = tail.y;
      } else {
        snake.pop();
      }
      // reset interpolation anchors
    }

    function die() {
      state = 'dead';
      deathT = 0;
      deathCells = snake.map((s) => ({ x: s.x, y: s.y }));
      shakeT = 0.5;
      const head = snake[0];
      burst((head.x + 0.5) * cell, (head.y + 0.5) * cell, WHITE, 26);
      setTimeout(() => {
        overlayTitle.textContent = score >= 30 ? 'nice run' : 'game over';
        overlaySub.textContent = 'score: ' + score;
        overlay.classList.add('show');
      }, 620);
    }

    function update(dt) {
      foodPulse += dt * 4;

      if (state === 'play') {
        moveTimer += dt * 1000;
        while (moveTimer >= moveInterval) {
          moveTimer -= moveInterval;
          // set previous positions for interpolation
          for (const s of snake) { s.px = s.x; s.py = s.y; }
          stepGame();
        }
      } else if (state === 'dead') {
        deathT += dt;
      }

      if (shakeT > 0) shakeT = Math.max(0, shakeT - dt);

      for (const p of particles) {
        p.x += p.vx; p.y += p.vy;
        p.vx *= 0.92; p.vy *= 0.92;
        p.life -= dt * 1.8;
      }
      particles = particles.filter((p) => p.life > 0);
    }

    function roundRect(x, y, w, h, r) {
      ctx.beginPath();
      ctx.moveTo(x + r, y);
      ctx.arcTo(x + w, y, x + w, y + h, r);
      ctx.arcTo(x + w, y + h, x, y + h, r);
      ctx.arcTo(x, y + h, x, y, r);
      ctx.arcTo(x, y, x + w, y, r);
      ctx.closePath();
    }

    function draw() {
      ctx.save();
      if (shakeT > 0) {
        const m = shakeT * 10;
        ctx.translate((Math.random() - 0.5) * m, (Math.random() - 0.5) * m);
      }

      ctx.fillStyle = '#030503';
      ctx.fillRect(-20, -20, W + 40, W + 40);

      // subtle grid
      ctx.strokeStyle = 'rgba(61,220,132,0.045)';
      ctx.lineWidth = 1;
      for (let i = 1; i < GRID; i++) {
        ctx.beginPath(); ctx.moveTo(i * cell, 0); ctx.lineTo(i * cell, W); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(0, i * cell); ctx.lineTo(W, i * cell); ctx.stroke();
      }

      // food (pulsing diamond)
      const pulse = 0.5 + Math.sin(foodPulse) * 0.5;
      const fx = (food.x + 0.5) * cell;
      const fy = (food.y + 0.5) * cell;
      const fr = cell * (0.3 + pulse * 0.08);
      ctx.save();
      ctx.translate(fx, fy);
      ctx.rotate(Math.PI / 4);
      ctx.fillStyle = RED;
      ctx.shadowColor = RED;
      ctx.shadowBlur = 12 + pulse * 8;
      ctx.fillRect(-fr, -fr, fr * 2, fr * 2);
      ctx.restore();
      ctx.shadowBlur = 0;

      // interpolation factor
      const t = state === 'play' ? Math.min(1, moveTimer / moveInterval) : 1;

      if (state !== 'dead' || deathT < 0.6) {
        const n = snake.length;
        for (let i = n - 1; i >= 0; i--) {
          const s = snake[i];
          let ix = s.px + (s.x - s.px) * t;
          let iy = s.py + (s.y - s.py) * t;
          if (state === 'dead') { ix = s.x; iy = s.y; }

          const px = ix * cell;
          const py = iy * cell;
          const pad = cell * 0.09;
          const seg = cell - pad * 2;

          const headness = 1 - i / n;
          if (i === 0) {
            ctx.fillStyle = WHITE;
            ctx.shadowColor = GREEN;
            ctx.shadowBlur = 14;
          } else {
            const g = Math.floor(120 + headness * 100);
            ctx.fillStyle = `rgb(${Math.floor(40 + headness * 30)}, ${g + 40}, ${Math.floor(90 + headness * 60)})`;
            ctx.shadowBlur = 0;
          }
          roundRect(px + pad, py + pad, seg, seg, cell * 0.22);
          ctx.fill();
        }
        ctx.shadowBlur = 0;
      }

      // particles
      for (const p of particles) {
        ctx.globalAlpha = Math.max(0, p.life);
        ctx.fillStyle = p.color;
        ctx.fillRect(p.x - p.size / 2, p.y - p.size / 2, p.size, p.size);
      }
      ctx.globalAlpha = 1;

      ctx.restore();
    }

    function frame(now) {
      const dt = Math.min(0.05, (now - last) / 1000);
      last = now;
      update(dt);
      draw();
      requestAnimationFrame(frame);
    }

    // ---- controls ----
    document.addEventListener('keydown', (e) => {
      const k = e.key.toLowerCase();
      if (k === 'arrowup' || k === 'w') pushDir(0, -1);
      else if (k === 'arrowdown' || k === 's') pushDir(0, 1);
      else if (k === 'arrowleft' || k === 'a') pushDir(-1, 0);
      else if (k === 'arrowright' || k === 'd') pushDir(1, 0);
    });

    let sx = 0, sy = 0;
    wrap.addEventListener('touchstart', (e) => {
      sx = e.touches[0].clientX; sy = e.touches[0].clientY;
    }, { passive: true });
    wrap.addEventListener('touchend', (e) => {
      const dx = e.changedTouches[0].clientX - sx;
      const dy = e.changedTouches[0].clientY - sy;
      if (Math.max(Math.abs(dx), Math.abs(dy)) < 20) return;
      if (Math.abs(dx) > Math.abs(dy)) pushDir(dx > 0 ? 1 : -1, 0);
      else pushDir(0, dy > 0 ? 1 : -1);
    }, { passive: true });

    restartBtn.addEventListener('click', reset);
    window.addEventListener('resize', resize);

    resize();
    reset();
    requestAnimationFrame(frame);
  </script>
</body>
</html>
