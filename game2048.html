<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>2048 — pgcs//arcade</title>
  <meta name="robots" content="noindex, nofollow" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="arcade.css" />
</head>
<body class="arcade-body">
  <div class="scanlines"></div>

  <main class="game-shell">
    <div class="game-topbar">
      <a href="secret.html">&larr; arcade</a>
      <span class="game-score">score: <span id="score">0</span></span>
    </div>

    <div class="game-canvas-wrap" id="wrap">
      <div class="grid2048" id="grid"></div>
      <div class="game-overlay" id="overlay">
        <h2 id="overlayTitle">game over</h2>
        <p id="overlaySub">score: 0</p>
        <button class="restart-btn" id="restartBtn">restart</button>
      </div>
    </div>

    <p class="game-hint">swipe to merge tiles &middot; arrow keys on desktop</p>
  </main>

  <script>
    const gridEl = document.getElementById('grid');
    const scoreEl = document.getElementById('score');
    const overlay = document.getElementById('overlay');
    const overlayTitle = document.getElementById('overlayTitle');
    const overlaySub = document.getElementById('overlaySub');
    const restartBtn = document.getElementById('restartBtn');

    const SIZE = 4;
    let board, score, won;

    function emptyBoard() {
      return Array.from({ length: SIZE }, () => Array(SIZE).fill(0));
    }

    function addRandomTile() {
      const empties = [];
      for (let r = 0; r < SIZE; r++) {
        for (let c = 0; c < SIZE; c++) {
          if (board[r][c] === 0) empties.push([r, c]);
        }
      }
      if (!empties.length) return;
      const [r, c] = empties[Math.floor(Math.random() * empties.length)];
      board[r][c] = Math.random() < 0.9 ? 2 : 4;
    }

    function reset() {
      board = emptyBoard();
      score = 0;
      won = false;
      addRandomTile();
      addRandomTile();
      scoreEl.textContent = '0';
      overlay.classList.remove('show');
      render();
    }

    function render() {
      gridEl.innerHTML = '';
      for (let r = 0; r < SIZE; r++) {
        for (let c = 0; c < SIZE; c++) {
          const v = board[r][c];
          const tile = document.createElement('div');
          tile.className = 'tile2048';
          tile.dataset.v = String(v);
          tile.textContent = v === 0 ? '' : String(v);
          gridEl.appendChild(tile);
        }
      }
    }

    function slideRow(row) {
      const vals = row.filter((v) => v !== 0);
      const merged = [];
      let gained = 0;
      for (let i = 0; i < vals.length; i++) {
        if (vals[i] === vals[i + 1]) {
          const m = vals[i] * 2;
          merged.push(m);
          gained += m;
          if (m === 2048) won = true;
          i++;
        } else {
          merged.push(vals[i]);
        }
      }
      while (merged.length < SIZE) merged.push(0);
      return { row: merged, gained };
    }

    function rotateBoard(b) {
      const r = emptyBoard();
      for (let i = 0; i < SIZE; i++) {
        for (let j = 0; j < SIZE; j++) {
          r[j][SIZE - 1 - i] = b[i][j];
        }
      }
      return r;
    }

    function move(dir) {
      // normalize to "left" by rotating, apply, rotate back
      let b = board;
      let rotations = 0;
      if (dir === 'up') rotations = 3;
      if (dir === 'right') rotations = 2;
      if (dir === 'down') rotations = 1;
      for (let i = 0; i < rotations; i++) b = rotateBoard(b);

      let changed = false;
      let totalGain = 0;
      const result = b.map((row) => {
        const before = row.join(',');
        const { row: after, gained } = slideRow(row);
        totalGain += gained;
        if (before !== after.join(',')) changed = true;
        return after;
      });

      let finalBoard = result;
      for (let i = 0; i < (4 - rotations) % 4; i++) finalBoard = rotateBoard(finalBoard);

      if (changed) {
        board = finalBoard;
        score += totalGain;
        scoreEl.textContent = String(score);
        addRandomTile();
        render();
        checkGameOver();
      }
    }

    function boardsEqual(a, b) {
      return a.every((row, r) => row.every((v, c) => v === b[r][c]));
    }

    function hasMoves() {
      for (let r = 0; r < SIZE; r++) {
        for (let c = 0; c < SIZE; c++) {
          if (board[r][c] === 0) return true;
          if (c < SIZE - 1 && board[r][c] === board[r][c + 1]) return true;
          if (r < SIZE - 1 && board[r][c] === board[r + 1][c]) return true;
        }
      }
      return false;
    }

    function checkGameOver() {
      if (won) {
        overlayTitle.textContent = 'you win';
        overlaySub.textContent = 'score: ' + score;
        overlay.classList.add('show');
        won = false; // let them keep playing if they dismiss... actually just show once
        return;
      }
      if (!hasMoves()) {
        overlayTitle.textContent = 'game over';
        overlaySub.textContent = 'score: ' + score;
        overlay.classList.add('show');
      }
    }

    // --- controls ---
    document.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowUp') move('up');
      if (e.key === 'ArrowDown') move('down');
      if (e.key === 'ArrowLeft') move('left');
      if (e.key === 'ArrowRight') move('right');
    });

    const wrap = document.getElementById('wrap');
    let touchStartX = 0, touchStartY = 0;
    wrap.addEventListener('touchstart', (e) => {
      touchStartX = e.touches[0].clientX;
      touchStartY = e.touches[0].clientY;
    }, { passive: true });

    wrap.addEventListener('touchend', (e) => {
      const dx = e.changedTouches[0].clientX - touchStartX;
      const dy = e.changedTouches[0].clientY - touchStartY;
      if (Math.max(Math.abs(dx), Math.abs(dy)) < 24) return;
      if (Math.abs(dx) > Math.abs(dy)) {
        move(dx > 0 ? 'right' : 'left');
      } else {
        move(dy > 0 ? 'down' : 'up');
      }
    }, { passive: true });

    restartBtn.addEventListener('click', reset);

    reset();
  </script>
</body>
</html>
