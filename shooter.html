<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>void runner — pgcs//arcade</title>
  <meta name="robots" content="noindex, nofollow" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="arcade.css" />
</head>
<body class="arcade-body">
  <div class="scanlines"></div>

  <main class="game-shell">
    <div class="game-topbar">
      <a href="secret.html">&larr; arcade</a>
      <span class="game-score">score: <span id="score">0</span> &middot; best: <span id="best">0</span></span>
    </div>

    <div class="game-canvas-wrap" id="wrap" style="aspect-ratio: 10 / 15; max-width: 380px;">
      <canvas id="canvas"></canvas>
      <div class="game-overlay" id="overlay">
        <h2 id="overlayTitle">game over</h2>
        <p id="overlaySub">score: 0</p>
        <button class="restart-btn" id="restartBtn">play again</button>
      </div>
    </div>

    <p class="game-hint">drag to fly &middot; auto-fire &middot; collect power-ups</p>
  </main>

  <script>
  (() => {
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const wrap = document.getElementById('wrap');
    const scoreEl = document.getElementById('score');
    const bestEl = document.getElementById('best');
    const overlay = document.getElementById('overlay');
    const overlayTitle = document.getElementById('overlayTitle');
    const overlaySub = document.getElementById('overlaySub');
    const restartBtn = document.getElementById('restartBtn');

    const GREEN = '#3ddc84';
    const GREEN_DIM = '#1f6b45';
    const WHITE = '#eafff2';
    const RED = '#ff5f5f';
    const AMBER = '#ffcf5f';
    const CYAN = '#5fe8ff';

    let W, H, dpr;
    let stars, player, bullets, enemyBullets, enemies, powerups, particles, popups;
    let score, best = 0, state; // 'ready'|'play'|'dead'
    let wave, waveTimer, spawnQueue, betweenWaves, waveBanner;
    let shakeT, flashT, last, time;
    let bossActive;

    // ---------- setup ----------
    function resize() {
      const rect = wrap.getBoundingClientRect();
      dpr = window.devicePixelRatio || 1;
      W = rect.width; H = rect.height;
      canvas.width = W * dpr; canvas.height = H * dpr;
      canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }

    function makeStars() {
      stars = [];
      for (let i = 0; i < 70; i++) {
        const layer = Math.random();
        stars.push({
          x: Math.random() * W, y: Math.random() * H,
          s: 0.4 + layer * 1.8,
          sp: 0.3 + layer * 1.6,
          a: 0.3 + layer * 0.5,
        });
      }
    }

    function reset() {
      makeStars();
      player = {
        x: W / 2, y: H * 0.8, tx: W / 2, ty: H * 0.8,
        r: 13, cooldown: 0, fireRate: 12,
        lives: 3, inv: 0,
        power: 'single', powerT: 0, // single|spread|rapid
        shield: 0, thrust: 0,
      };
      bullets = []; enemyBullets = []; enemies = []; powerups = [];
      particles = []; popups = [];
      score = 0; wave = 0; state = 'ready';
      betweenWaves = 0; waveBanner = 0;
      spawnQueue = [];
      shakeT = 0; flashT = 0; time = 0;
      bossActive = false;
      scoreEl.textContent = '0';
      bestEl.textContent = String(best);
      overlay.classList.remove('show');
      last = performance.now();
    }

    // ---------- waves ----------
    function startWave(n) {
      wave = n;
      waveBanner = 2.2;
      const q = [];
      const isBoss = n % 5 === 0;
      if (isBoss) {
        q.push({ t: 0.6, type: 'boss', hp: 40 + n * 8 });
        bossActive = true;
      } else {
        const count = 4 + n * 2;
        for (let i = 0; i < count; i++) {
          const roll = Math.random();
          let type = 'grunt';
          if (n >= 2 && roll > 0.75) type = 'weaver';
          if (n >= 3 && roll > 0.88) type = 'diver';
          if (n >= 4 && roll > 0.93) type = 'turret';
          q.push({ t: 0.5 + i * (0.85 - Math.min(0.5, n * 0.04)), type });
        }
      }
      spawnQueue = q;
      betweenWaves = 0;
    }

    function spawnEnemy(spec) {
      const x = 30 + Math.random() * (W - 60);
      if (spec.type === 'grunt') {
        enemies.push({ type: 'grunt', x, y: -20, r: 14, hp: 2, maxHp: 2, t: Math.random() * 6, vy: 1.1, sinA: 20 + Math.random() * 20, hit: 0 });
      } else if (spec.type === 'weaver') {
        enemies.push({ type: 'weaver', x, y: -20, r: 13, hp: 3, maxHp: 3, t: Math.random() * 6, vy: 0.8, amp: W * 0.32, cx: W / 2, hit: 0 });
      } else if (spec.type === 'diver') {
        enemies.push({ type: 'diver', x, y: -20, r: 15, hp: 3, maxHp: 3, phase: 'enter', targetY: 60 + Math.random() * 60, wait: 0, hit: 0, vy: 0 });
      } else if (spec.type === 'turret') {
        enemies.push({ type: 'turret', x, y: -20, r: 16, hp: 5, maxHp: 5, vy: 0.5, fire: 1.5 + Math.random(), hit: 0, stopY: 70 + Math.random() * 70 });
      } else if (spec.type === 'boss') {
        enemies.push({
          type: 'boss', x: W / 2, y: -80, r: 46, hp: spec.hp, maxHp: spec.hp,
          phase: 'enter', t: 0, fire1: 0, fire2: 0, dir: 1, hit: 0,
        });
      }
    }

    // ---------- input ----------
    let dragging = false;
    function pointerPos(e) {
      const rect = canvas.getBoundingClientRect();
      const src = e.touches ? e.touches[0] : e;
      return { x: src.clientX - rect.left, y: src.clientY - rect.top };
    }
    function onDown(e) {
      if (state === 'ready') state = 'play', startWave(1);
      if (state === 'dead') return;
      dragging = true;
      const p = pointerPos(e);
      // set target with an upward offset so finger doesn't cover the ship
      player.tx = p.x;
      player.ty = p.y - 46;
      if (e.cancelable) e.preventDefault();
    }
    function onMove(e) {
      if (!dragging || state !== 'play') return;
      const p = pointerPos(e);
      player.tx = p.x;
      player.ty = p.y - 46;
      if (e.cancelable) e.preventDefault();
    }
    function onUp() { dragging = false; }

    canvas.addEventListener('touchstart', onDown, { passive: false });
    canvas.addEventListener('touchmove', onMove, { passive: false });
    canvas.addEventListener('touchend', onUp);
    canvas.addEventListener('mousedown', onDown);
    canvas.addEventListener('mousemove', onMove);
    window.addEventListener('mouseup', onUp);

    const keys = {};
    document.addEventListener('keydown', (e) => {
      keys[e.key.toLowerCase()] = true;
      if (state === 'ready' && (e.key === ' ' || e.key.startsWith('Arrow'))) { state = 'play'; startWave(1); }
    });
    document.addEventListener('keyup', (e) => { keys[e.key.toLowerCase()] = false; });

    // ---------- helpers ----------
    function explode(x, y, color, n, spd) {
      for (let i = 0; i < n; i++) {
        const a = Math.random() * Math.PI * 2;
        const s = (0.5 + Math.random()) * (spd || 3);
        particles.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: 1, decay: 1.2 + Math.random(), r: 1 + Math.random() * 2.5, color });
      }
    }
    function popup(x, y, text, color) {
      popups.push({ x, y, text, color, life: 1 });
    }
    function dropPowerup(x, y) {
      if (Math.random() > 0.16) return;
      const kinds = ['spread', 'rapid', 'shield', 'life'];
      const weights = [0.35, 0.35, 0.22, 0.08];
      let r = Math.random(), k = 'spread', acc = 0;
      for (let i = 0; i < kinds.length; i++) { acc += weights[i]; if (r <= acc) { k = kinds[i]; break; } }
      powerups.push({ x, y, kind: k, vy: 1.4, t: 0, r: 11 });
    }

    function fire() {
      const bx = player.x, by = player.y - player.r;
      const shots = [];
      if (player.power === 'spread') {
        shots.push({ vx: -2.4, vy: -9 }, { vx: 0, vy: -10 }, { vx: 2.4, vy: -9 });
      } else {
        shots.push({ vx: 0, vy: -10 });
        if (player.power === 'rapid') { /* handled via fireRate */ }
      }
      for (const s of shots) bullets.push({ x: bx, y: by, vx: s.vx, vy: s.vy, r: 3 });
      // muzzle flash
      for (let i = 0; i < 3; i++) particles.push({ x: bx, y: by, vx: (Math.random() - 0.5) * 2, vy: -Math.random() * 2, life: 1, decay: 4, r: 1.5, color: CYAN });
    }

    // ---------- update ----------
    function update(dt) {
      time += dt;
      const f = dt * 60;

      // stars
      const scroll = state === 'play' ? 1 : 0.4;
      for (const s of stars) {
        s.y += s.sp * f * scroll;
        if (s.y > H) { s.y = -2; s.x = Math.random() * W; }
      }

      // ready state — gentle idle
      if (state !== 'play') {
        for (const p of particles) { p.x += p.vx * f; p.y += p.vy * f; p.life -= dt * p.decay; }
        particles = particles.filter((p) => p.life > 0);
        return;
      }

      // keyboard movement (desktop)
      const kbSpeed = 6 * f;
      if (keys['arrowleft'] || keys['a']) { player.tx -= kbSpeed; dragging = false; }
      if (keys['arrowright'] || keys['d']) { player.tx += kbSpeed; dragging = false; }
      if (keys['arrowup'] || keys['w']) { player.ty -= kbSpeed; dragging = false; }
      if (keys['arrowdown'] || keys['s']) { player.ty += kbSpeed; dragging = false; }

      // move ship toward target (smooth)
      player.tx = Math.max(player.r, Math.min(W - player.r, player.tx));
      player.ty = Math.max(player.r, Math.min(H - player.r, player.ty));
      const dx = player.tx - player.x, dy = player.ty - player.y;
      player.x += dx * Math.min(1, 0.25 * f);
      player.y += dy * Math.min(1, 0.25 * f);
      player.thrust = Math.min(1, Math.abs(dx) + Math.abs(dy));

      if (player.inv > 0) player.inv -= dt;
      if (player.powerT > 0) { player.powerT -= dt; if (player.powerT <= 0) player.power = 'single'; }

      // auto fire
      player.cooldown -= f;
      const rate = player.power === 'rapid' ? 6 : 11;
      if (player.cooldown <= 0) { fire(); player.cooldown = rate; }

      // spawn queue
      for (const spec of spawnQueue) {
        spec.t -= dt;
        if (spec.t <= 0 && !spec.done) { spec.done = true; spawnEnemy(spec); }
      }
      spawnQueue = spawnQueue.filter((s) => !s.done);

      // wave progression
      if (state === 'play' && spawnQueue.length === 0 && enemies.length === 0 && waveBanner <= 0) {
        betweenWaves += dt;
        if (betweenWaves > 1.4) startWave(wave + 1);
      }
      if (waveBanner > 0) waveBanner -= dt;

      // player bullets
      for (const b of bullets) { b.x += b.vx * f; b.y += b.vy * f; }
      bullets = bullets.filter((b) => b.y > -10 && b.x > -10 && b.x < W + 10);

      // enemies
      for (const e of enemies) {
        e.hit = Math.max(0, (e.hit || 0) - dt * 4);
        if (e.type === 'grunt') {
          e.t += dt;
          e.y += e.vy * f;
          e.x += Math.sin(e.t * 2) * e.sinA * 0.02 * f;
        } else if (e.type === 'weaver') {
          e.t += dt;
          e.y += e.vy * f;
          e.x = e.cx + Math.sin(e.t * 1.6) * e.amp;
        } else if (e.type === 'diver') {
          if (e.phase === 'enter') {
            e.y += 1.6 * f;
            if (e.y >= e.targetY) { e.phase = 'aim'; e.wait = 0.6; }
          } else if (e.phase === 'aim') {
            e.wait -= dt;
            e.x += (player.x - e.x) * 0.04 * f;
            if (e.wait <= 0) { e.phase = 'dive'; e.vy = 0.5; }
          } else {
            e.vy += 0.35 * f; e.y += e.vy * f;
          }
        } else if (e.type === 'turret') {
          if (e.y < e.stopY) e.y += e.vy * f;
          e.fire -= dt;
          if (e.fire <= 0 && e.y > 0) {
            e.fire = 1.6;
            const a = Math.atan2(player.y - e.y, player.x - e.x);
            enemyBullets.push({ x: e.x, y: e.y, vx: Math.cos(a) * 3.4, vy: Math.sin(a) * 3.4, r: 4, color: RED });
          }
        } else if (e.type === 'boss') {
          e.t += dt;
          if (e.phase === 'enter') {
            e.y += 1.2 * f;
            if (e.y >= 90) e.phase = 'fight';
          } else {
            e.x += e.dir * 1.4 * f;
            if (e.x < e.r + 10) { e.x = e.r + 10; e.dir = 1; }
            if (e.x > W - e.r - 10) { e.x = W - e.r - 10; e.dir = -1; }
            // pattern 1: aimed triple
            e.fire1 -= dt;
            if (e.fire1 <= 0) {
              e.fire1 = 1.1;
              const base = Math.atan2(player.y - e.y, player.x - e.x);
              for (let k = -1; k <= 1; k++) {
                const a = base + k * 0.28;
                enemyBullets.push({ x: e.x, y: e.y + e.r * 0.6, vx: Math.cos(a) * 3.2, vy: Math.sin(a) * 3.2, r: 4, color: RED });
              }
            }
            // pattern 2: radial spray
            e.fire2 -= dt;
            if (e.fire2 <= 0) {
              e.fire2 = 2.6;
              const spokes = 14;
              for (let k = 0; k < spokes; k++) {
                const a = (k / spokes) * Math.PI * 2 + e.t;
                enemyBullets.push({ x: e.x, y: e.y, vx: Math.cos(a) * 2.2, vy: Math.sin(a) * 2.2, r: 3.5, color: AMBER });
              }
            }
          }
        }
      }

      // enemy bullets
      for (const b of enemyBullets) { b.x += b.vx * f; b.y += b.vy * f; }
      enemyBullets = enemyBullets.filter((b) => b.y < H + 12 && b.y > -12 && b.x > -12 && b.x < W + 12);

      // powerups fall
      for (const p of powerups) { p.t += dt; p.y += p.vy * f; p.x += Math.sin(p.t * 3) * 0.6; }
      powerups = powerups.filter((p) => p.y < H + 20);

      // ---- collisions: player bullets vs enemies ----
      for (const b of bullets) {
        for (const e of enemies) {
          const dxx = b.x - e.x, dyy = b.y - e.y;
          if (dxx * dxx + dyy * dyy < (e.r + b.r) * (e.r + b.r)) {
            b.dead = true;
            e.hp -= 1;
            e.hit = 1;
            explode(b.x, b.y, GREEN, 4, 2);
            if (e.hp <= 0) {
              e.dead = true;
              const pts = e.type === 'boss' ? 500 : e.type === 'turret' ? 40 : e.type === 'diver' ? 30 : e.type === 'weaver' ? 25 : 15;
              score += pts;
              scoreEl.textContent = String(score);
              popup(e.x, e.y, '+' + pts, WHITE);
              explode(e.x, e.y, e.type === 'boss' ? WHITE : GREEN, e.type === 'boss' ? 60 : 16, e.type === 'boss' ? 6 : 3.5);
              shakeT = Math.max(shakeT, e.type === 'boss' ? 0.6 : 0.14);
              if (e.type === 'boss') { flashT = 0.3; bossActive = false; }
              dropPowerup(e.x, e.y);
            }
            break;
          }
        }
      }
      bullets = bullets.filter((b) => !b.dead);
      enemies = enemies.filter((e) => !e.dead && e.y < H + 60);

      // ---- powerup pickup ----
      for (const p of powerups) {
        const dxx = p.x - player.x, dyy = p.y - player.y;
        if (dxx * dxx + dyy * dyy < (p.r + player.r + 4) ** 2) {
          p.dead = true;
          if (p.kind === 'spread') { player.power = 'spread'; player.powerT = 10; popup(player.x, player.y - 20, 'SPREAD', CYAN); }
          else if (p.kind === 'rapid') { player.power = 'rapid'; player.powerT = 10; popup(player.x, player.y - 20, 'RAPID', CYAN); }
          else if (p.kind === 'shield') { player.shield = 1; popup(player.x, player.y - 20, 'SHIELD', GREEN); }
          else if (p.kind === 'life') { player.lives = Math.min(5, player.lives + 1); popup(player.x, player.y - 20, '+1 LIFE', AMBER); }
          explode(p.x, p.y, CYAN, 12, 3);
        }
      }
      powerups = powerups.filter((p) => !p.dead);

      // ---- hazards vs player ----
      if (player.inv <= 0) {
        const hitPlayer = () => {
          if (player.shield > 0) {
            player.shield = 0; player.inv = 1; explode(player.x, player.y, GREEN, 20, 4);
            popup(player.x, player.y - 20, 'BLOCKED', GREEN); shakeT = 0.25; return;
          }
          player.lives -= 1;
          player.inv = 1.6;
          shakeT = 0.5; flashT = 0.3;
          explode(player.x, player.y, WHITE, 30, 5);
          if (player.lives <= 0) endGame();
        };
        // enemy bullets
        for (const b of enemyBullets) {
          const dxx = b.x - player.x, dyy = b.y - player.y;
          if (dxx * dxx + dyy * dyy < (b.r + player.r) ** 2) { b.dead = true; hitPlayer(); break; }
        }
        // enemy bodies
        if (player.inv <= 0) {
          for (const e of enemies) {
            const dxx = e.x - player.x, dyy = e.y - player.y;
            if (dxx * dxx + dyy * dyy < (e.r + player.r) ** 2) {
              if (e.type !== 'boss') { e.dead = true; explode(e.x, e.y, GREEN, 14, 3); }
              hitPlayer(); break;
            }
          }
        }
      }
      enemyBullets = enemyBullets.filter((b) => !b.dead);
      enemies = enemies.filter((e) => !e.dead);

      // particles / popups
      for (const p of particles) { p.x += p.vx * f; p.y += p.vy * f; p.vx *= 0.96; p.vy *= 0.96; p.life -= dt * p.decay; }
      particles = particles.filter((p) => p.life > 0);
      for (const p of popups) { p.y -= 0.6 * f; p.life -= dt * 1.3; }
      popups = popups.filter((p) => p.life > 0);

      if (shakeT > 0) shakeT = Math.max(0, shakeT - dt);
      if (flashT > 0) flashT = Math.max(0, flashT - dt);
    }

    function endGame() {
      state = 'dead';
      shakeT = 0.7; flashT = 0.4;
      explode(player.x, player.y, WHITE, 50, 6);
      explode(player.x, player.y, GREEN, 30, 4);
      if (score > best) { best = score; bestEl.textContent = String(best); }
      setTimeout(() => {
        overlayTitle.textContent = wave >= 10 ? 'legend' : wave >= 5 ? 'nice run' : 'game over';
        overlaySub.textContent = 'score: ' + score + ' \u00b7 wave ' + wave;
        overlay.classList.add('show');
      }, 700);
    }

    // ---------- draw ----------
    function drawShip(x, y, r, invBlink) {
      if (invBlink) { ctx.globalAlpha = 0.4; }
      // thruster flame
      const flame = 6 + Math.sin(time * 30) * 3 + player.thrust * 4;
      ctx.fillStyle = player.power === 'rapid' ? CYAN : AMBER;
      ctx.globalAlpha *= 0.85;
      ctx.beginPath();
      ctx.moveTo(x - 4, y + r * 0.5);
      ctx.lineTo(x, y + r * 0.5 + flame);
      ctx.lineTo(x + 4, y + r * 0.5);
      ctx.closePath(); ctx.fill();
      ctx.globalAlpha = invBlink ? 0.4 : 1;

      // body (arrow)
      ctx.fillStyle = WHITE;
      ctx.shadowColor = GREEN; ctx.shadowBlur = 12;
      ctx.beginPath();
      ctx.moveTo(x, y - r);
      ctx.lineTo(x + r * 0.85, y + r * 0.7);
      ctx.lineTo(x, y + r * 0.35);
      ctx.lineTo(x - r * 0.85, y + r * 0.7);
      ctx.closePath(); ctx.fill();
      ctx.shadowBlur = 0;
      // cockpit
      ctx.fillStyle = GREEN;
      ctx.beginPath(); ctx.arc(x, y - r * 0.15, r * 0.22, 0, Math.PI * 2); ctx.fill();

      // shield ring
      if (player.shield > 0) {
        ctx.strokeStyle = GREEN; ctx.globalAlpha = 0.5 + Math.sin(time * 8) * 0.2;
        ctx.lineWidth = 2;
        ctx.beginPath(); ctx.arc(x, y, r + 8, 0, Math.PI * 2); ctx.stroke();
        ctx.globalAlpha = 1;
      }
      ctx.globalAlpha = 1;
    }

    function drawEnemy(e) {
      ctx.save();
      ctx.translate(e.x, e.y);
      const flash = e.hit > 0.5;
      if (e.type === 'grunt') {
        ctx.fillStyle = flash ? WHITE : GREEN;
        ctx.beginPath();
        ctx.moveTo(0, e.r); ctx.lineTo(e.r, -e.r * 0.6); ctx.lineTo(-e.r, -e.r * 0.6);
        ctx.closePath(); ctx.fill();
        ctx.fillStyle = '#05130b';
        ctx.beginPath(); ctx.arc(0, -e.r * 0.1, e.r * 0.28, 0, Math.PI * 2); ctx.fill();
      } else if (e.type === 'weaver') {
        ctx.fillStyle = flash ? WHITE : '#7fe8b0';
        ctx.beginPath();
        for (let i = 0; i < 6; i++) {
          const a = (i / 6) * Math.PI * 2;
          const rr = i % 2 ? e.r * 0.55 : e.r;
          ctx[i ? 'lineTo' : 'moveTo'](Math.cos(a) * rr, Math.sin(a) * rr);
        }
        ctx.closePath(); ctx.fill();
      } else if (e.type === 'diver') {
        ctx.fillStyle = flash ? WHITE : AMBER;
        ctx.beginPath();
        ctx.moveTo(0, e.r); ctx.lineTo(e.r * 0.8, 0); ctx.lineTo(0, -e.r); ctx.lineTo(-e.r * 0.8, 0);
        ctx.closePath(); ctx.fill();
      } else if (e.type === 'turret') {
        ctx.fillStyle = flash ? WHITE : '#d98fff';
        ctx.beginPath(); ctx.arc(0, 0, e.r, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = '#05130b';
        ctx.fillRect(-e.r * 0.15, 0, e.r * 0.3, e.r);
      } else if (e.type === 'boss') {
        // hp bar
        ctx.restore();
        const bw = W * 0.7, bx = (W - bw) / 2;
        ctx.fillStyle = 'rgba(255,255,255,0.1)';
        ctx.fillRect(bx, 10, bw, 5);
        ctx.fillStyle = RED;
        ctx.fillRect(bx, 10, bw * (e.hp / e.maxHp), 5);
        ctx.save();
        ctx.translate(e.x, e.y);
        ctx.fillStyle = flash ? WHITE : RED;
        ctx.shadowColor = RED; ctx.shadowBlur = 20;
        // hexagonal hull
        ctx.beginPath();
        for (let i = 0; i < 6; i++) {
          const a = (i / 6) * Math.PI * 2 + Math.PI / 6;
          ctx[i ? 'lineTo' : 'moveTo'](Math.cos(a) * e.r, Math.sin(a) * e.r * 0.7);
        }
        ctx.closePath(); ctx.fill();
        ctx.shadowBlur = 0;
        ctx.fillStyle = '#1a0505';
        ctx.beginPath(); ctx.arc(0, 0, e.r * 0.4, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = AMBER;
        ctx.beginPath(); ctx.arc(0, 0, e.r * 0.4 * (0.6 + Math.sin(time * 4) * 0.2), 0, Math.PI * 2); ctx.fill();
      }
      ctx.restore();
    }

    function draw() {
      ctx.save();
      if (shakeT > 0) {
        const m = shakeT * 12;
        ctx.translate((Math.random() - 0.5) * m, (Math.random() - 0.5) * m);
      }

      ctx.fillStyle = '#030503';
      ctx.fillRect(-20, -20, W + 40, H + 40);

      // stars
      for (const s of stars) {
        ctx.globalAlpha = s.a;
        ctx.fillStyle = s.s > 1.4 ? WHITE : GREEN_DIM;
        ctx.fillRect(s.x, s.y, s.s, s.s);
      }
      ctx.globalAlpha = 1;

      // powerups
      for (const p of powerups) {
        const col = p.kind === 'shield' ? GREEN : p.kind === 'life' ? AMBER : CYAN;
        ctx.strokeStyle = col; ctx.lineWidth = 2;
        ctx.globalAlpha = 0.6 + Math.sin(p.t * 6) * 0.4;
        ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2); ctx.stroke();
        ctx.globalAlpha = 1;
        ctx.fillStyle = col;
        ctx.font = `500 ${p.r}px 'IBM Plex Mono', monospace`;
        ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        const letter = p.kind === 'spread' ? 'S' : p.kind === 'rapid' ? 'R' : p.kind === 'shield' ? '+' : '\u2665';
        ctx.fillText(letter, p.x, p.y + 1);
      }

      // player bullets
      ctx.fillStyle = CYAN;
      ctx.shadowColor = CYAN; ctx.shadowBlur = 6;
      for (const b of bullets) {
        ctx.fillRect(b.x - b.r / 2, b.y - b.r * 1.6, b.r, b.r * 3.2);
      }
      ctx.shadowBlur = 0;

      // enemy bullets
      for (const b of enemyBullets) {
        ctx.fillStyle = b.color;
        ctx.shadowColor = b.color; ctx.shadowBlur = 6;
        ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2); ctx.fill();
      }
      ctx.shadowBlur = 0;

      // enemies
      for (const e of enemies) drawEnemy(e);

      // player
      if (state !== 'dead') {
        drawShip(player.x, player.y, player.r, player.inv > 0 && Math.floor(time * 20) % 2 === 0);
      }

      // particles
      for (const p of particles) {
        ctx.globalAlpha = Math.max(0, p.life);
        ctx.fillStyle = p.color;
        ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2); ctx.fill();
      }
      ctx.globalAlpha = 1;

      // popups
      for (const p of popups) {
        ctx.globalAlpha = Math.max(0, p.life);
        ctx.fillStyle = p.color;
        ctx.font = `500 12px 'IBM Plex Mono', monospace`;
        ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillText(p.text, p.x, p.y);
      }
      ctx.globalAlpha = 1;

      ctx.restore();

      // ---- HUD ----
      // lives
      for (let i = 0; i < player.lives; i++) {
        const lx = 14 + i * 16, ly = H - 14;
        ctx.fillStyle = WHITE;
        ctx.beginPath();
        ctx.moveTo(lx, ly - 6); ctx.lineTo(lx + 5, ly + 4); ctx.lineTo(lx - 5, ly + 4);
        ctx.closePath(); ctx.fill();
      }
      // power timer bar
      if (player.powerT > 0) {
        ctx.fillStyle = 'rgba(95,232,255,0.25)';
        ctx.fillRect(W - 74, H - 16, 60, 4);
        ctx.fillStyle = CYAN;
        ctx.fillRect(W - 74, H - 16, 60 * (player.powerT / 10), 4);
      }

      // wave banner
      if (waveBanner > 0 && state === 'play') {
        const a = Math.min(1, waveBanner) * Math.min(1, (2.2 - waveBanner) * 3);
        ctx.globalAlpha = a;
        ctx.fillStyle = WHITE;
        ctx.font = `500 ${W * 0.07}px 'IBM Plex Mono', monospace`;
        ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        const label = wave % 5 === 0 ? 'WARNING \u2014 BOSS' : 'WAVE ' + wave;
        ctx.fillText(label, W / 2, H * 0.4);
        ctx.globalAlpha = 1;
      }

      // ready screen
      if (state === 'ready') {
        ctx.fillStyle = WHITE;
        ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.font = `500 ${W * 0.09}px 'IBM Plex Mono', monospace`;
        ctx.fillText('VOID RUNNER', W / 2, H * 0.34);
        ctx.fillStyle = GREEN_DIM;
        ctx.font = `400 ${W * 0.038}px 'IBM Plex Mono', monospace`;
        ctx.fillText('drag anywhere to fly', W / 2, H * 0.44);
        ctx.fillText('the ship auto-fires', W / 2, H * 0.49);
        const blink = 0.5 + Math.sin(time * 4) * 0.5;
        ctx.globalAlpha = 0.4 + blink * 0.6;
        ctx.fillStyle = WHITE;
        ctx.font = `500 ${W * 0.045}px 'IBM Plex Mono', monospace`;
        ctx.fillText('tap to start', W / 2, H * 0.6);
        ctx.globalAlpha = 1;
        drawShip(W / 2, H * 0.74, 16, false);
      }

      // death flash
      if (flashT > 0) {
        ctx.fillStyle = `rgba(255,95,95,${flashT * 0.4})`;
        ctx.fillRect(0, 0, W, H);
      }
    }

    function frame(now) {
      const dt = Math.min(0.04, (now - last) / 1000);
      last = now;
      update(dt);
      draw();
      requestAnimationFrame(frame);
    }

    restartBtn.addEventListener('click', reset);
    window.addEventListener('resize', resize);

    resize();
    reset();
    requestAnimationFrame(frame);
  })();
  </script>
</body>
</html>
