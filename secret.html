<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>_</title>
  <meta name="robots" content="noindex, nofollow" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="arcade.css" />
</head>
<body class="arcade-body">
  <div class="scanlines"></div>
  <div class="crt-flicker"></div>

  <div class="terminal">
    <div class="terminal-log" id="log"></div>
    <nav class="game-menu" id="menu">
      <a class="game-menu-item" href="snake.html">snake <span class="arrow">&gt;</span></a>
      <a class="game-menu-item" href="game2048.html">2048 <span class="arrow">&gt;</span></a>
      <a class="game-menu-item" href="runner.html">runner <span class="arrow">&gt;</span></a>
    </nav>
    <a class="exit-link" href="index.html">&larr; exit</a>
  </div>

  <script>
    const logEl = document.getElementById('log');
    const menuEl = document.getElementById('menu');
    const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

    const lines = [
      { text: 'connecting to pgcs//arcade...', cls: 'dim' },
      { text: 'access granted.', cls: 'white' },
      { text: '' },
      { text: 'welcome.', cls: 'white' },
      { text: 'select a program to run:' },
    ];

    function typeLine(line, container, onDone) {
      const span = document.createElement('div');
      if (line.cls) span.className = line.cls;
      container.appendChild(span);

      if (!line.text) { onDone(); return; }

      let i = 0;
      const speed = 16;
      const timer = setInterval(() => {
        span.textContent += line.text[i];
        i++;
        if (i >= line.text.length) {
          clearInterval(timer);
          onDone();
        }
      }, speed);
    }

    function typeAll(lines, container, onAllDone) {
      let idx = 0;
      function next() {
        if (idx >= lines.length) { onAllDone(); return; }
        typeLine(lines[idx], container, () => {
          idx++;
          setTimeout(next, 120);
        });
      }
      next();
    }

    if (reduceMotion) {
      lines.forEach((l) => {
        const div = document.createElement('div');
        if (l.cls) div.className = l.cls;
        div.textContent = l.text;
        logEl.appendChild(div);
      });
      menuEl.classList.add('show');
    } else {
      const cursor = document.createElement('span');
      cursor.className = 'cursor';
      logEl.appendChild(cursor);

      setTimeout(() => {
        cursor.remove();
        typeAll(lines, logEl, () => {
          const cursorEnd = document.createElement('span');
          cursorEnd.className = 'cursor';
          logEl.appendChild(cursorEnd);
          setTimeout(() => {
            menuEl.classList.add('show');
          }, 300);
        });
      }, 500);
    }
  </script>
</body>
</html>
