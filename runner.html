<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>runner — pgcs//arcade</title>
  <meta name="robots" content="noindex, nofollow" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="arcade.css" />
</head>
<body class="arcade-body">
  <div class="scanlines"></div>

  <main class="game-shell">
    <div class="game-topbar">
      <a href="secret.html">&larr; arcade</a>
      <span class="game-score">score: <span id="score">0</span> &middot; best: <span id="best">0</span></span>
    </div>

    <div class="game-canvas-wrap" id="wrap" style="aspect-ratio: 16 / 10;">
      <canvas id="canvas"></canvas>
      <div class="game-overlay" id="overlay">
        <h2 id="overlayTitle">game over</h2>
        <p id="overlaySub">score: 0</p>
        <button class="restart-btn" id="restartBtn">play again</button>
      </div>
    </div>

    <p class="game-hint" id="hint">tap to jump &middot; double-jump in the air</p>
  </main>

  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const wrap = document.getElementById('wrap');
    const scoreEl = document.getElementById('score');
    const bestEl = document.getElementById('best');
    const overlay = document.getElementById('overlay');
    const overlayTitle = document.getElementById('overlayTitle');
    const overlaySub = document.getElementById('overlaySub');
    const restartBtn = document.getElementById('restartBtn');

    const GREEN = '#3ddc84';
    const GREEN_DIM = '#1f6b45';
    const WHITE = '#eafff2';
    const RED = '#ff5f5f';

    let W, H, dpr, groundY;
    let player, obstacles, stars, hills, particles;
    let speed, dist, score, best = 0, state; // 'ready' | 'play' | 'dead'
    let spawnGap, spawnAcc, shakeT, flashT, last, started;

    function resize() {
      const rect = wrap.getBoundingClientRect();
      dpr = window.devicePixelRatio || 1;
      W = rect.width; H = rect.height;
      canvas.width = W * dpr; canvas.height = H * dpr;
      canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      groundY = H * 0.82;
      if (player) player.baseY = groundY;
    }

    function makeStars() {
      stars = [];
      for (let i = 0; i < 40; i++) {
        stars.push({ x: Math.random() * W, y: Math.random() * groundY * 0.9, s: Math.random() * 1.5 + 0.3, sp: 0.15 + Math.random() * 0.4 });
      }
      hills = [];
      let x = 0;
      while (x < W + 200) {
        const w = 80 + Math.random() * 120;
        hills.push({ x, w, h: 20 + Math.random() * 55 });
        x += w;
      }
    }

    function reset() {
      makeStars();
      player = {
        x: W * 0.16, y: groundY, baseY: groundY,
        w: 22, h: 26, vy: 0, onGround: true, jumps: 0,
        sx: 1, sy: 1, // squash/stretch
        runT: 0,
      };
      obstacles = [];
      particles = [];
      speed = 5.2;
      dist = 0; score = 0;
      spawnGap = 90; spawnAcc = 60;
      shakeT = 0; flashT = 0;
      state = 'ready';
      started = false;
      scoreEl.textContent = '0';
      bestEl.textContent = String(best);
      overlay.classList.remove('show');
      last = performance.now();
    }

    function jump() {
      if (state === 'ready') { state = 'play'; started = true; return; }
      if (state === 'dead') return;
      if (player.onGround) {
        player.vy = -11.5; player.onGround = false; player.jumps = 1;
        player.sx = 0.7; player.sy = 1.35;
        puff();
      } else if (player.jumps < 2) {
        player.vy = -10; player.jumps = 2;
        player.sx = 0.75; player.sy = 1.3;
        puff();
      }
    }

    function puff() {
      for (let i = 0; i < 8; i++) {
        const a = Math.PI * 0.5 + (Math.random() - 0.5) * 1.4;
        const sp = 1 + Math.random() * 2;
        particles.push({ x: player.x + player.w / 2, y: player.y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp * 0.6 + 1, life: 1, c: GREEN_DIM, r: 1 + Math.random() * 2 });
      }
    }

    function spawnObstacle() {
      const kind = Math.random();
      if (kind < 0.6) {
        const h = 22 + Math.random() * 30;
        obstacles.push({ type: 'block', x: W + 20, y: groundY - h, w: 16 + Math.random() * 12, h });
      } else if (kind < 0.82) {
        // tall thin spike pair
        const h = 40 + Math.random() * 20;
        obstacles.push({ type: 'block', x: W + 20, y: groundY - h, w: 12, h });
      } else {
        // floating obstacle you must stay grounded under OR jump — mid height bar
        const gapY = groundY - (55 + Math.random() * 25);
        obstacles.push({ type: 'bar', x: W + 20, y: gapY, w: 22, h: 14 });
      }
    }

    function die() {
      state = 'dead';
      shakeT = 0.55; flashT = 0.25;
      for (let i = 0; i < 30; i++) {
        const a = Math.random() * Math.PI * 2, sp = 2 + Math.random() * 4;
        particles.push({ x: player.x + player.w / 2, y: player.y - player.h / 2, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, life: 1, c: i % 3 === 0 ? WHITE : GREEN, r: 1.5 + Math.random() * 3 });
      }
      if (score > best) { best = score; bestEl.textContent = String(best); }
      setTimeout(() => {
        overlayTitle.textContent = score >= 500 ? 'incredible' : score >= 200 ? 'nice run' : 'game over';
        overlaySub.textContent = 'score: ' + score;
        overlay.classList.add('show');
      }, 560);
    }

    function update(dt) {
      const f = dt * 60; // frame-normalized

      // parallax always animates a little on ready screen too
      const bgSpeed = state === 'play' ? speed : 1.5;
      for (const s of stars) {
        s.x -= s.sp * bgSpeed * f * 0.25;
        if (s.x < -2) { s.x = W + 2; s.y = Math.random() * groundY * 0.9; }
      }
      for (const hl of hills) {
        hl.x -= bgSpeed * 0.35 * f;
      }
      // recycle hills
      let minRight = Infinity;
      for (const hl of hills) minRight = Math.min(minRight, hl.x + hl.w);
      hills = hills.filter((hl) => hl.x + hl.w > -10);
      let maxRight = 0;
      for (const hl of hills) maxRight = Math.max(maxRight, hl.x + hl.w);
      while (maxRight < W + 200) {
        const w = 80 + Math.random() * 120;
        hills.push({ x: maxRight, w, h: 20 + Math.random() * 55 });
        maxRight += w;
      }

      // player squash/stretch easing back to 1
      player.sx += (1 - player.sx) * 0.2 * f;
      player.sy += (1 - player.sy) * 0.2 * f;
      player.runT += f;

      if (state === 'play') {
        dist += speed * f;
        score = Math.floor(dist / 10);
        scoreEl.textContent = String(score);
        speed = 5.2 + dist * 0.0009;

        player.vy += 0.62 * f;
        player.y += player.vy * f;
        if (player.y >= player.baseY) {
          if (!player.onGround) { player.sx = 1.3; player.sy = 0.7; } // land squash
          player.y = player.baseY; player.vy = 0; player.onGround = true; player.jumps = 0;
        }

        spawnAcc += f;
        if (spawnAcc >= spawnGap) {
          spawnAcc = 0;
          spawnObstacle();
          spawnGap = Math.max(45, 90 - dist * 0.006);
        }

        for (const o of obstacles) o.x -= speed * f;
        obstacles = obstacles.filter((o) => o.x + o.w > -20);

        // collision (slightly forgiving hitbox)
        const px = player.x + 3, pw = player.w - 6;
        const py = player.y - player.h + 2, ph = player.h - 2;
        for (const o of obstacles) {
          if (px < o.x + o.w && px + pw > o.x && py < o.y + o.h && py + ph > o.y) {
            die(); break;
          }
        }
      }

      for (const p of particles) {
        p.x += p.vx * f; p.y += p.vy * f;
        p.vy += 0.15 * f; p.vx *= 0.96;
        p.life -= dt * 1.6;
      }
      particles = particles.filter((p) => p.life > 0);

      if (shakeT > 0) shakeT = Math.max(0, shakeT - dt);
      if (flashT > 0) flashT = Math.max(0, flashT - dt);
    }

    function draw() {
      ctx.save();
      if (shakeT > 0) {
        const m = shakeT * 14;
        ctx.translate((Math.random() - 0.5) * m, (Math.random() - 0.5) * m);
      }

      // sky
      const grad = ctx.createLinearGradient(0, 0, 0, H);
      grad.addColorStop(0, '#040a06');
      grad.addColorStop(1, '#030503');
      ctx.fillStyle = grad;
      ctx.fillRect(-20, -20, W + 40, H + 40);

      // stars
      for (const s of stars) {
        ctx.globalAlpha = 0.5 + s.s * 0.3;
        ctx.fillStyle = GREEN_DIM;
        ctx.fillRect(s.x, s.y, s.s, s.s);
      }
      ctx.globalAlpha = 1;

      // hills silhouette
      ctx.fillStyle = 'rgba(31,107,69,0.25)';
      for (const hl of hills) {
        ctx.beginPath();
        ctx.moveTo(hl.x, groundY);
        ctx.lineTo(hl.x + hl.w / 2, groundY - hl.h);
        ctx.lineTo(hl.x + hl.w, groundY);
        ctx.closePath();
        ctx.fill();
      }

      // ground line + dashes
      ctx.strokeStyle = GREEN_DIM;
      ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.moveTo(0, groundY); ctx.lineTo(W, groundY); ctx.stroke();
      ctx.strokeStyle = 'rgba(61,220,132,0.18)';
      ctx.lineWidth = 2;
      const dash = 22; const off = (dist * 0.5) % dash;
      for (let x = -off; x < W; x += dash) {
        ctx.beginPath(); ctx.moveTo(x, groundY + 6); ctx.lineTo(x + dash * 0.5, groundY + 6); ctx.stroke();
      }

      // obstacles
      for (const o of obstacles) {
        ctx.fillStyle = o.type === 'bar' ? RED : GREEN;
        if (o.type !== 'bar') { ctx.shadowColor = GREEN; ctx.shadowBlur = 8; }
        ctx.fillRect(o.x, o.y, o.w, o.h);
        ctx.shadowBlur = 0;
      }

      // player
      const cx = player.x + player.w / 2;
      const bob = state === 'play' && player.onGround ? Math.sin(player.runT * 0.4) * 1.2 : 0;
      const drawH = player.h * player.sy;
      const drawW = player.w * player.sx;
      const topY = player.y - drawH + bob;
      ctx.fillStyle = WHITE;
      ctx.shadowColor = GREEN; ctx.shadowBlur = 12;
      // rounded body
      const r = 5;
      const bx = cx - drawW / 2, by = topY;
      ctx.beginPath();
      ctx.moveTo(bx + r, by);
      ctx.arcTo(bx + drawW, by, bx + drawW, by + drawH, r);
      ctx.arcTo(bx + drawW, by + drawH, bx, by + drawH, r);
      ctx.arcTo(bx, by + drawH, bx, by, r);
      ctx.arcTo(bx, by, bx + drawW, by, r);
      ctx.closePath();
      ctx.fill();
      ctx.shadowBlur = 0;
      // eye (faces right)
      ctx.fillStyle = '#05130b';
      ctx.fillRect(bx + drawW * 0.6, by + drawH * 0.28, drawW * 0.16, drawH * 0.16);

      // particles
      for (const p of particles) {
        ctx.globalAlpha = Math.max(0, p.life);
        ctx.fillStyle = p.c;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.globalAlpha = 1;

      // ready prompt
      if (state === 'ready') {
        ctx.fillStyle = WHITE;
        ctx.font = `500 ${Math.max(14, W * 0.035)}px 'IBM Plex Mono', monospace`;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        const blink = 0.5 + Math.sin(performance.now() / 300) * 0.5;
        ctx.globalAlpha = 0.5 + blink * 0.5;
        ctx.fillText('tap to start', W / 2, H * 0.42);
        ctx.globalAlpha = 1;
      }

      ctx.restore();

      // death flash
      if (flashT > 0) {
        ctx.fillStyle = `rgba(255,95,95,${flashT * 0.5})`;
        ctx.fillRect(0, 0, W, H);
      }
    }

    function frame(now) {
      const dt = Math.min(0.045, (now - last) / 1000);
      last = now;
      update(dt);
      draw();
      requestAnimationFrame(frame);
    }

    // ---- input ----
    function onTap(e) { e.preventDefault(); jump(); }
    canvas.addEventListener('touchstart', onTap, { passive: false });
    canvas.addEventListener('mousedown', jump);
    document.addEventListener('keydown', (e) => {
      if (e.code === 'Space' || e.key === 'ArrowUp' || e.key.toLowerCase() === 'w') { e.preventDefault(); jump(); }
    });

    restartBtn.addEventListener('click', reset);
    window.addEventListener('resize', resize);

    resize();
    reset();
    requestAnimationFrame(frame);
  </script>
</body>
</html>
